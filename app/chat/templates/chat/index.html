<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local AI test page</title>
  <style>
    body { font-family: system-ui, "Segoe UI", Arial, sans-serif; max-width: 820px; margin: 24px auto; padding: 0 16px; color: #1f1f1f; }
    h1 { font-size: 20px; }
    label { display: block; font-size: 13px; color: #555; margin-top: 12px; }
    textarea, input[type=number] { width: 100%; box-sizing: border-box; font: inherit; padding: 8px; border: 1px solid #bbb; border-radius: 6px; }
    .row { display: flex; gap: 16px; flex-wrap: wrap; }
    .row div { flex: 1; min-width: 160px; }
    button { margin-top: 12px; padding: 8px 18px; font: inherit; border: 0; border-radius: 6px; background: #1a6fd6; color: #fff; cursor: pointer; }
    button.stop { background: #c62828; }
    button:disabled { background: #9ab8e0; cursor: not-allowed; }
    #answer { white-space: pre-wrap; border: 1px solid #ddd; border-radius: 6px; padding: 12px; min-height: 80px; margin-top: 16px; background: #fafafa; }
    #status { font-size: 13px; color: #555; margin-top: 8px; }
    .error { color: #b00020 !important; }
  </style>
</head>
<body>
  <h1>Local AI test page</h1>
  <p><a href="/lc/">Open LC Check</a></p>
  <p style="font-size:13px;color:#555">Runs fully on this PC. No login. For testing only.</p>
  {% csrf_token %}

  <label for="system">System prompt</label>
  <textarea id="system" rows="2">{{ default_system }}</textarea>

  <div class="row">
    <div>
      <label for="temperature">Temperature (0 to 1.5)</label>
      <input id="temperature" type="number" min="0" max="1.5" step="0.1" value="0.3">
    </div>
    <div>
      <label for="max_tokens">Max answer length (tokens)</label>
      <input id="max_tokens" type="number" min="16" max="1024" step="16" value="300">
    </div>
  </div>

  <label for="message">Your question</label>
  <textarea id="message" rows="6" placeholder="Type or paste text here..."></textarea>
  <button id="send">Send</button>
  <button id="stop" class="stop" disabled>Stop</button>

  <div id="status"></div>
  <div id="answer"></div>

  <script>
    const sendBtn = document.getElementById("send");
    const stopBtn = document.getElementById("stop");
    const answerEl = document.getElementById("answer");
    const statusEl = document.getElementById("status");
    const csrf = document.querySelector("[name=csrfmiddlewaretoken]").value;
    let controller = null;

    function setStatus(text, isError) {
      statusEl.className = isError ? "error" : "";
      statusEl.textContent = text;
    }

    function setBusy(busy) {
      sendBtn.disabled = busy;
      stopBtn.disabled = !busy;
    }

    stopBtn.addEventListener("click", () => {
      if (controller) controller.abort();
    });

    sendBtn.addEventListener("click", async () => {
      const message = document.getElementById("message").value.trim();
      if (!message) { setStatus("Please type a question.", true); return; }

      setBusy(true);
      answerEl.textContent = "";
      setStatus("Reading your question... the first word can take a while on this PC.");
      controller = new AbortController();
      let gotFirst = false;

      try {
        const resp = await fetch("/api/chat/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-CSRFToken": csrf },
          signal: controller.signal,
          body: JSON.stringify({
            message: message,
            system: document.getElementById("system").value,
            temperature: Number(document.getElementById("temperature").value),
            max_tokens: Number(document.getElementById("max_tokens").value),
          }),
        });

        if (!resp.ok) {
          const data = await resp.json().catch(() => ({}));
          setStatus(data.error || "Something went wrong.", true);
          return;
        }

        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split("\n");
          buffer = lines.pop();            // keep the unfinished line
          for (const line of lines) {
            if (!line.trim()) continue;
            const ev = JSON.parse(line);
            if (ev.type === "token") {
              if (!gotFirst) { gotFirst = true; setStatus("Writing..."); }
              answerEl.textContent += ev.text;   // textContent, not innerHTML
            } else if (ev.type === "done") {
              const speed = ev.tokens_per_second ? " | " + ev.tokens_per_second + " tokens/s" : "";
              const first = ev.first_token !== null ? "First word " + ev.first_token + " s | " : "";
              setStatus(first + "Total " + ev.seconds + " s" + speed);
            } else if (ev.type === "error") {
              setStatus(ev.message, true);
            }
          }
        }
      } catch (err) {
        if (err.name === "AbortError") {
          setStatus("Stopped.");
        } else {
          setStatus("Could not reach the Django server.", true);
        }
      } finally {
        controller = null;
        setBusy(false);
      }
    });
  </script>
</body>
</html>
